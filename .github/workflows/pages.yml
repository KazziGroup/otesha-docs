# Publish the manuals to GitHub Pages.
#
# The internal build is what ships, so the site carries all five manuals — the
# team needs one link that reaches everything, and while the manuals are still
# being written that matters more than the audience split. The site is public:
# unlisted, not gated. Anyone with the address can read it.
#
# The split itself is not going anywhere. `DOCS_AUDIENCE=external` still builds
# the nine-page client manual and `npm run check` still proves each build
# contains what it should, so pointing this workflow at the client build later
# is a one-word change rather than a rebuild.
#
# `DOCS_BASE` is set because a project-repo Pages site is served at /<repo>/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Enough to publish, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the manuals
        env:
          DOCS_AUDIENCE: internal
          DOCS_BASE: /otesha-docs/
        run: npx vite build
      - name: Refuse to publish a build that is missing manuals
        # A build that silently loses the admin manual still renders, still
        # deploys, and reads as a complete site — the team would just find
        # nothing where the payout pages should be. Assert the bytes.
        run: scripts/check-dist-audience.sh dist internal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
